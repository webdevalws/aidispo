<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 100" fill="none">
  <defs>
    <!-- Needle Metal Gradient -->
    <linearGradient id="needleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Hub Gradient -->
    <linearGradient id="hubGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Barrel Glass Gradient -->
    <linearGradient id="barrelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="30%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Cyan Plunger Gradient -->
    <linearGradient id="plungerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#00a8ff"/>
      <stop offset="100%" stop-color="#013572"/>
    </linearGradient>
    
    <!-- Rubber Stopper Gradient -->
    <linearGradient id="stopperGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- 1. Needle Tip & Shaft -->
  <line x1="32" y1="2" x2="32" y2="24" stroke="url(#needleGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Bevel Tip Highlight -->
  <polygon points="32,2 34,7 32,7" fill="#64748b"/>

  <!-- 2. Luer Needle Hub -->
  <polygon points="28,24 36,24 38,32 26,32" fill="url(#hubGrad)" stroke="#013572" stroke-width="1.2"/>
  <rect x="29" y="32" width="6" height="4" fill="#cbd5e1" stroke="#013572" stroke-width="1"/>

  <!-- 3. Syringe Outer Barrel -->
  <rect x="20" y="36" width="24" height="42" rx="2" fill="url(#barrelGrad)" stroke="#013572" stroke-width="2"/>

  <!-- Rubber Piston Stopper inside barrel -->
  <rect x="21" y="44" width="22" height="7" rx="1.5" fill="url(#stopperGrad)"/>

  <!-- Measurement Graduation Marks on Barrel -->
  <!-- 0.5 mL -->
  <line x1="21" y1="42" x2="28" y2="42" stroke="#013572" stroke-width="1.5" stroke-linecap="round"/>
  <!-- 1.0 mL -->
  <line x1="21" y1="48" x2="31" y2="48" stroke="#013572" stroke-width="1.8" stroke-linecap="round"/>
  <!-- 1.5 mL -->
  <line x1="21" y1="54" x2="28" y2="54" stroke="#013572" stroke-width="1.5" stroke-linecap="round"/>
  <!-- 2.0 mL -->
  <line x1="21" y1="60" x2="31" y2="60" stroke="#013572" stroke-width="1.8" stroke-linecap="round"/>
  <!-- 2.5 mL -->
  <line x1="21" y1="66" x2="28" y2="66" stroke="#013572" stroke-width="1.5" stroke-linecap="round"/>
  <!-- 3.0 mL -->
  <line x1="21" y1="72" x2="31" y2="72" stroke="#013572" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Syringe Barrel Finger Flange (Wings) -->
  <rect x="14" y="78" width="36" height="5" rx="2.5" fill="#e2e8f0" stroke="#013572" stroke-width="1.5"/>

  <!-- 4. Plunger Shaft (Cyan Brand Color) -->
  <rect x="29" y="51" width="6" height="38" fill="url(#plungerGrad)" stroke="#013572" stroke-width="1"/>
  <!-- Plunger Ribs -->
  <line x1="27" y1="83" x2="37" y2="83" stroke="#00a8ff" stroke-width="2"/>

  <!-- Plunger Thumb Rest -->
  <ellipse cx="32" cy="94" rx="10" ry="3.5" fill="url(#plungerGrad)" stroke="#013572" stroke-width="1.5"/>
</svg>
